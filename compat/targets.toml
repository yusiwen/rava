# Target lock: the single source of truth for the pinned platform (ADR-0002).
# A version bump is a re-baseline: regenerate the manifest and the stub library,
# reopen the gap count and rerun the gates. It is never a silent dependency update.

schema = 1

[platform]
java = "17"
class_file = "61.0"
spring_boot = "3.5.16"
spring_framework = "6.2.19"
tomcat = "10.1.55"

[reference_app]
path = "reference-app"
version = "0.1.0"
main_class = "dev.rava.reference.ReferenceApplication"
# Deterministic sha256 of reference-app/pom.xml and reference-app/src/, printed by
# `bash compat/source-hash.sh`. fetch-jars.sh refuses to build against another tree.
source_sha256 = "cb78ed489b27964b765c0f923b73d759fa1248cf0899e1ad8e91d9e5903d3450"

[jars]
directory = "compat/jars"
lock = "compat/jars.lock"
# Must equal `count` in compat/jars.lock; compat target checks it.
count = 35

[manifest]
# Static surface manifest (ADR-0003, M1.2). `rava compat manifest --check`
# regenerates it in memory and byte-compares this file.
path = "compat/surface/spring-boot-3.5.16.txt"

[stubs]
# Signature-only class library (M1.3), generated from the manifest by
# `rava compat stubs`. Regenerate it whenever the manifest changes; the class
# files are committed deliverables, not build output.
path = "stdlib/classes"

[c1]
# JDK 17 signature stubs (M2.2), generated by `rava compat c1-stubs` from the
# host JDK's lib/ct.sym release-17 entries. This is a separate committed tree, not
# the M1 signature stubs above; M2.3 promotes it to the runtime library.
path = "stdlib/c1/classes"
# Manifest owners that Java 17 does not define and therefore cannot have a
# release-17 signature. The generator fails if this list and ct.sym disagree.
unreferenced = "compat/surface/c1-unreferenced.txt"
