name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Toolchain
        run: |
          nix develop --command bash -c \
            'rustc --version; cargo clippy --version; java -version' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gate
        run: nix develop --command cargo xtask ci

      # The ledger checker is what proves a slice row, its note and its acceptance command agree.
      # It is pure bash and grep, so it runs without the devShell and costs seconds.
      - name: Ledger and docs
        run: bash scripts/workflow-check.sh .
