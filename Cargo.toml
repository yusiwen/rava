[workspace]
resolver = "3"
members = [
    "crates/classfile",
    "crates/vm",
    "crates/interp",
    "crates/native",
    "crates/cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["yusiwen"]
rust-version = "1.85"

[workspace.dependencies]
rava-classfile = { path = "crates/classfile" }
rava-vm = { path = "crates/vm" }
rava-interp = { path = "crates/interp" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
